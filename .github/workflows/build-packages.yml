name: Reusable - Build AmneziaWG packages

# Reusable building block shared by the release and the snapshot workflows.
# It compiles the whole AmneziaWG package set for a single OpenWrt target using
# the official SDK and uploads the result as a workflow artifact.

on:
  workflow_call:
    inputs:
      openwrt_version:
        description: "OpenWrt version, either SNAPSHOT or a release such as 24.10.2"
        type: string
        required: true
      amneziawg_version:
        description: "YAAWG release tag, branch or commit hash to build"
        type: string
        required: true
      openwrt_target:
        description: "OpenWrt target"
        type: string
        required: true
      openwrt_subtarget:
        description: "OpenWrt subtarget"
        type: string
        required: true
      artifact_prefix:
        description: "Prefix of the produced artifact name"
        type: string
        required: false
        default: "amneziawg"

jobs:
  build:
    name: "${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout YAAWG repository
        uses: actions/checkout@v5
        with:
          path: amneziawg
          ref: ${{ inputs.amneziawg_version }}
          fetch-depth: 0

      - name: Checkout OpenWRT Packages repository
        uses: actions/checkout@v5
        with:
          path: packages
          repository: openwrt/packages
          fetch-depth: 1

      - name: Install additional packages
        run: |
          set -e -x
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig

      - name: Download and prepare SDK
        run: |
          set -e -x
          if [ "${{ inputs.openwrt_version }}" = "SNAPSHOT" ]; then
            base_url="https://downloads.openwrt.org/snapshots/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/"
          else
            base_url="https://downloads.openwrt.org/releases/${{ inputs.openwrt_version }}/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/"
          fi
          sdk_url=$(curl -s "${base_url}" | grep -oP 'href="openwrt-sdk[^"]+\.tar\.(zst|xz)"' | sed -e 's/href="//' -e 's/"$//' | head -n1)
          if [[ -z "$sdk_url" ]]; then
            echo "SDK file not found."
            exit 1
          fi
          curl -fsLO "$base_url$sdk_url"
          file_name=$(basename "$sdk_url")
          tar -xf "$file_name"
          rm -f *.tar.zst *.tar.xz
          mv openwrt-sdk* openwrt

          echo "src-cpy awgopenwrt ../amneziawg" >> openwrt/feeds.conf.default
          ./openwrt/scripts/feeds update -a
          curl -fsL "$base_url/config.buildinfo" > openwrt/.config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-amneziawg=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_amneziawg-go=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> openwrt/.config
          # amneziawg-go requires Go >= 1.25. Only override the SDK's Go feed
          # when it is actually too old.
          sdk_go=$(sed -n 's/^GO_DEFAULT_VERSION:=//p' openwrt/feeds/packages/lang/golang/golang-values.mk)
          need_go=1.25
          if [ -n "$sdk_go" ] && [ "$(printf '%s\n%s\n' "$need_go" "$sdk_go" | sort -V | head -n1)" != "$need_go" ]; then
            echo "SDK ships Go $sdk_go (< $need_go); overriding golang feed from openwrt/packages."
            rm -r openwrt/feeds/packages/lang/golang
            cp -r packages/lang/golang openwrt/feeds/packages/lang
          else
            echo "SDK ships Go ${sdk_go:-unknown} (>= $need_go); keeping the SDK golang feed."
          fi
          ./openwrt/scripts/feeds install -a
          make -C openwrt defconfig

      - name: Compile AmneziaWG packages
        run: |
          set -e -x
          cd openwrt
          make package/kmod-amneziawg/{clean,download,prepare,compile} -j "$(nproc)"
          make package/amneziawg-go/{clean,download,prepare,compile} -j "$(nproc)"
          make package/amneziawg-tools/{clean,download,prepare,compile} -j "$(nproc)"
          make package/luci-proto-amneziawg/{clean,download,prepare,compile} -j "$(nproc)"

      - name: Prepare artifacts
        run: |
          set -e -x
          mkdir awgrelease

          # The package architecture cannot be reliably derived from the target
          # name — bcm53xx/generic for instance builds arm_cortex-a9 and not
          # arm_cortex-a9_vfpv3-d16 — so it is taken from what the SDK actually
          # produced.
          pkg_dir="$(find openwrt/bin/packages -mindepth 2 -maxdepth 2 -type d -name awgopenwrt -print -quit)"
          if [ -z "$pkg_dir" ]; then
            echo "No AmneziaWG packages were built below openwrt/bin/packages."
            exit 1
          fi
          arch="$(basename "$(dirname "$pkg_dir")")"
          echo "OPENWRT_ARCH=$arch" >> "$GITHUB_ENV"

          find "$pkg_dir" \
            -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} awgrelease \;
          find "openwrt/bin/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/packages" \
            -maxdepth 1 -type f -name 'kmod-amneziawg*' -exec cp {} awgrelease \;

          # `find' stays silent when it matches nothing, so make sure that every
          # package really made it into the artifact.
          for pkg in kmod-amneziawg amneziawg-go amneziawg-tools luci-proto-amneziawg; do
            ls awgrelease | grep -q "^${pkg}[-_]" || { echo "Package ${pkg} is missing."; exit 1; }
          done

          # The kernel module can only be installed on a firmware whose kernel
          # reports the very same vermagic. Let's calculate it.
          vermagic=""
          vermagic_file="$(find openwrt/build_dir -maxdepth 5 -type f -name '.vermagic' -print -quit)"
          if [ -n "$vermagic_file" ]; then
            vermagic="$(cat "$vermagic_file")"
          fi
          if [ -z "$vermagic" ]; then
            vermagic="$(sed -n 's/.*LINUX_VERMAGIC),\([^,)]*\))[[:space:]]*$/\1/p' openwrt/include/kernel.mk | head -n1)"
          fi
          [ -n "$vermagic" ] || vermagic="unknown"
          {
            echo "YAAWG version: ${{ inputs.amneziawg_version }}"
            echo "OpenWrt version: ${{ inputs.openwrt_version }}"
            echo "Target: ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
            echo "Architecture: $arch"
            echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Vermagic: $vermagic"
          } > awgrelease/build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ inputs.openwrt_target }}-${{ inputs.openwrt_subtarget }}-${{ env.OPENWRT_ARCH }}
          path: awgrelease/*
          if-no-files-found: error
