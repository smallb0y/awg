name: Legacy - step 2. Build AmneziaWG from cache

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        type: string
        required: true
        default: "SNAPSHOT"
      openwrt_arch:
        description: "OpenWrt arch"
        type: string
        required: true
        default: "aarch64_cortex-a53"
      openwrt_target:
        description: "OpenWrt target"
        type: string
        required: true
        default: "mediatek"
      openwrt_subtarget:
        description: "OpenWrt subtarget"
        type: string
        required: true
        default: "filogic"
      compile_kmod:
        description: "Compile kernel module inplementation"
        type: boolean
        required: true
        default: true
      compile_go:
        description: "Compile Go implementation"
        type: boolean
        required: true
        default: true

jobs:
  build-amneziawg:
    name: "Build AmneziaWG for OpenWrt: ${{ inputs.openwrt_version }} - ${{ inputs.openwrt_arch }} - ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout OpenWRT repository
      uses: actions/checkout@v5
      with:
        path: openwrt
        repository: openwrt/openwrt
        ref: ${{ inputs.openwrt_version == 'SNAPSHOT' && 'master' || format('v{0}', inputs.openwrt_version) }}
        fetch-depth: 0

    - name: Restore cached tools and kernel
      uses: actions/cache/restore@v4
      with:
        key: ${{ runner.os }}-openwrt-cache-toolchain-kernel-${{ inputs.openwrt_version }}-${{ inputs.openwrt_arch }}-${{ inputs.openwrt_target }}-${{ inputs.openwrt_subtarget }}
        fail-on-cache-miss: true
        path: |
          openwrt/.config
          openwrt/.config.old
          openwrt/feeds.conf.default
          openwrt/bin/**
          openwrt/build_dir/**
          openwrt/dl/**
          openwrt/feeds/**
          openwrt/package/**
          openwrt/staging_dir/**
          openwrt/tmp/**

    - name: Compile AmneziaWG packages
      env:
        compile_kmod: ${{ inputs.compile_kmod }}
        compile_go: ${{ inputs.compile_go }}
      run: |
        set -e -x
        cd openwrt
        if [ "${{ env.compile_kmod }}" = "true" ]; then
          make package/kmod-amneziawg/{clean,download,prepare,compile} -j $(nproc)
        fi
        if [ "${{ env.compile_go }}" = "true" ]; then
          make package/amneziawg-go/{clean,download,prepare,compile} -j $(nproc)
        fi
        make package/luci-proto-amneziawg/{clean,download,prepare,compile} -j $(nproc)
        make package/amneziawg-tools/{clean,download,prepare,compile} -j $(nproc)

    - name: Prepare artifacts
      env:
        compile_kmod: ${{ inputs.compile_kmod }}
      run: |
        set -e -x
        mkdir awgrelease

        # The kernel module can only be installed on a firmware whose kernel
        # reports the very same vermagic. Let's calculate it.
        vermagic=""
        vermagic_file="$(find openwrt/build_dir -maxdepth 5 -type f -name '.vermagic' -print -quit)"
        if [ -n "$vermagic_file" ]; then
          vermagic="$(cat "$vermagic_file")"
        fi
        if [ -z "$vermagic" ]; then
          vermagic="$(sed -n 's/.*LINUX_VERMAGIC),\([^,)]*\))[[:space:]]*$/\1/p' openwrt/include/kernel.mk | head -n1)"
        fi
        [ -n "$vermagic" ] || vermagic="unknown"

        # AmneziaWG version calculation
        awg_version=""
        awg_makefile="$(find openwrt/feeds openwrt/package -maxdepth 4 -type f -path '*kmod-amneziawg/Makefile' -print -quit 2>/dev/null)"
        if [ -n "$awg_makefile" ]; then
          awg_version="$(sed -n 's/^PKG_VERSION:=//p' "$awg_makefile" | head -n1)"
        fi
        [ -n "$awg_version" ] || awg_version="unknown"

        {
          echo "YAAWG version: $awg_version"
          echo "OpenWrt version: ${{ inputs.openwrt_version }}"
          echo "Target: ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
          echo "Architecture: ${{ inputs.openwrt_arch }}"
          echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Vermagic: $vermagic"
        } > awgrelease/build-info.txt
        if [ "${{ env.compile_kmod }}" = "true" ]; then
          find "openwrt/bin/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/packages" -maxdepth 1 -type f -name 'kmod-amneziawg*' -exec cp {} awgrelease \;
        fi
        find "openwrt/bin/packages/${{ inputs.openwrt_arch }}/awgopenwrt" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} awgrelease \;

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: amneziawg-${{ inputs.openwrt_version }}_${{ inputs.openwrt_arch }}_${{ inputs.openwrt_target }}_${{ inputs.openwrt_subtarget }}
        path: awgrelease/*
