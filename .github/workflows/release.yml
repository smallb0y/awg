name: Release - Build AmneziaWG for the latest OpenWrt release

# Builds the whole package set for every architecture listed in
# .github/targets.json against a stable OpenWrt release and attaches the result
# to a GitHub release.
#
# Pushing a `vX.Y.Z' tag creates a draft release holding the freshly built
# packages, so that the changelog can be written before it becomes public.
# Running the workflow by hand against an already existing release only adds
# the new archives to it, which is how an unchanged YAAWG version is rebuilt
# for a newly published OpenWrt release.

on:
  push:
    tags:
      - "v*"
  schedule:
    # Once a day check whether a newer stable OpenWrt release appeared and, if
    # so, build the latest published YAAWG release for it and attach the
    # archives to that release. Nothing happens when everything is up to date.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      amneziawg_version:
        description: "YAAWG release tag, branch or commit hash to build"
        type: string
        required: true
        default: "master"
      openwrt_version:
        description: "OpenWrt release to build against, or `latest`"
        type: string
        required: true
        default: "latest"
      publish:
        description: "Attach the packages to the release named after the built version"
        type: boolean
        required: true
        default: false
      draft:
        description: "Create the release as a draft, if it does not exist yet"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve build parameters
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.params.outputs.targets }}
      openwrt_version: ${{ steps.params.outputs.openwrt_version }}
      amneziawg_version: ${{ steps.params.outputs.amneziawg_version }}
      publish: ${{ steps.params.outputs.publish }}
      draft: ${{ steps.params.outputs.draft }}
      skip: ${{ steps.params.outputs.skip }}
    steps:
      - name: Checkout YAAWG repository
        uses: actions/checkout@v5

      - name: Resolve parameters
        id: params
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e -o pipefail

          echo "targets=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"

          requested="${{ inputs.openwrt_version || 'latest' }}"
          if [ "$requested" = "latest" ]; then
            requested=$(curl -fsS https://downloads.openwrt.org/releases/ \
              | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -n1)
          fi
          if [ -z "$requested" ]; then
            echo "Unable to determine the latest OpenWrt release."
            exit 1
          fi
          echo "openwrt_version=$requested" >> "$GITHUB_OUTPUT"

          # `skip' short-circuits the build and publish jobs when there is
          # nothing to do (used by the daily scheduled run).
          skip=false

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "amneziawg_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Find the latest published (non-draft, non-prerelease) YAAWG
            # release. The `snapshot' pre-release is skipped on purpose. The
            # first page of the releases API (newest first) is more than enough.
            tag=$(gh api "repos/${GH_REPO}/releases" \
              --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')

            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "No published stable release to update; nothing to do."
              skip=true
              echo "amneziawg_version=master" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
            else
              # The archives carry the OpenWrt version in their name, so their
              # presence tells whether this release was already built for it.
              if gh release view "$tag" --json assets \
                --jq '.assets[].name' \
                | grep -q -- "-openwrt-${requested}\.tar\.gz$"; then
                echo "Release $tag already has packages for OpenWrt $requested; nothing to do."
                skip=true
              else
                echo "Building release $tag for the new OpenWrt $requested."
              fi
              echo "amneziawg_version=$tag" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "amneziawg_version=${{ inputs.amneziawg_version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/build-packages.yml
    with:
      openwrt_version: ${{ needs.prepare.outputs.openwrt_version }}
      amneziawg_version: ${{ needs.prepare.outputs.amneziawg_version }}
      openwrt_target: ${{ matrix.target.target }}
      openwrt_subtarget: ${{ matrix.target.subtarget }}
      artifact_prefix: amneziawg

  publish:
    name: Publish release
    needs: [ prepare, build ]
    if: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack artifacts
        run: |
          set -e -x
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czf "dist/${name}-openwrt-${{ needs.prepare.outputs.openwrt_version }}.tar.gz" -C "$dir" .
          done

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.amneziawg_version }}
          OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -e
          if view_error="$(gh release view "$TAG" 2>&1 >/dev/null)"; then
            echo "Adding the OpenWrt $OPENWRT_VERSION packages to the existing release $TAG."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          elif ! printf '%s' "$view_error" | grep -qi 'release not found'; then
            echo "Unable to look up the release $TAG: $view_error"
            exit 1
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing to create a release for '$TAG', which is not a tag."
            echo "Tag the commit first, or re-run with an existing release tag."
            exit 1
          fi


          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated-notes.md || true

          {
            printf 'Packages built against OpenWrt %s.\n\n' "$OPENWRT_VERSION"
            printf 'Every archive contains `kmod-amneziawg`, `amneziawg-go`, `amneziawg-tools`,\n'
            printf '`luci-proto-amneziawg` and the localization package for one target. Pick the\n'
            printf 'archive matching your `Target Platform` and package architecture, see the\n'
            printf 'README for installation instructions.\n\n'
            cat generated-notes.md
          } > notes.md

          echo "Creating release $TAG with the OpenWrt $OPENWRT_VERSION packages."
          gh release create "$TAG" dist/* \
            --title "YAAWG $TAG" \
            --notes-file notes.md \
            $([ "$DRAFT" = "true" ] && echo --draft)
